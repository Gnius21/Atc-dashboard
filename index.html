<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOSTER OBSERVATOREN 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg:     #060b1a;
  --card:   #0d1526;
  --panel:  #111e35;
  --accent: #3b82f6;
  --acl:    #60a5fa;
  --green:  #4ade80;
  --tp:     #f1f5f9;
  --ts:     #94a3b8;
  --bdr:    #1e2d45;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: radial-gradient(ellipse at top, #0d1a3a 0%, var(--bg) 65%);
  color: var(--tp);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  padding: 20px 16px 40px;
}

.container { max-width: 1300px; margin: 0 auto; }

/* HEADER */
.header { text-align:center; margin-bottom:28px; }
.header h1 {
  font-size: 42px; font-weight: 900; letter-spacing:-1px;
  background: linear-gradient(120deg, var(--acl), var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header p { color:var(--ts); font-size:12px; margin-top:4px; }

/* TABS */
.tabs-wrap {
  background: var(--card); border:1px solid var(--bdr);
  border-radius:12px; padding:10px;
  display:flex; flex-wrap:wrap; gap:5px; justify-content:center;
  margin-bottom:18px;
}
.tab-btn {
  padding:7px 14px; font-size:10px; font-weight:700;
  font-family:'Outfit',sans-serif;
  background:var(--panel); border:1px solid var(--bdr);
  border-radius:5px; color:var(--ts); cursor:pointer;
  text-transform:uppercase; letter-spacing:0.5px;
  transition:all 0.2s;
}
.tab-btn:hover { border-color:var(--accent); color:var(--acl); }
.tab-btn.active {
  background:var(--accent); color:#fff;
  border-color:var(--accent);
  box-shadow:0 4px 14px rgba(59,130,246,0.4);
}

/* CARD */
.card {
  background:var(--card); border:1px solid var(--bdr);
  border-radius:14px; padding:20px;
  box-shadow:0 16px 48px rgba(0,0,0,0.5);
}

/* MONTH TITLE */
.month-heading {
  font-size:20px; font-weight:800; color:var(--acl);
  text-align:center; margin-bottom:16px;
  letter-spacing:0.5px;
}

/* STATS */
.stats-row {
  display:grid; grid-template-columns:repeat(5,1fr);
  gap:8px; margin-bottom:16px;
}
.stat {
  background:var(--panel); border:1px solid var(--bdr);
  border-radius:8px; padding:10px 6px; text-align:center;
  transition:transform 0.2s;
}
.stat:hover { transform:translateY(-2px); }
.stat.gma-stat { border-color:var(--green); background:rgba(74,222,128,0.07); }
.stat-name { font-size:9px; font-weight:700; color:var(--ts); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }
.stat.gma-stat .stat-name { color:var(--green); }
.stat-hrs { font-size:24px; font-weight:900; font-family:'JetBrains Mono',monospace; color:var(--acl); }
.stat.gma-stat .stat-hrs { color:var(--green); }
.stat-lbl { font-size:9px; color:var(--ts); margin-top:2px; }

/* LEGEND */
.legend {
  display:flex; gap:8px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--bdr);
  border-radius:8px; padding:8px 12px; margin-bottom:14px;
  font-size:10px;
}
.leg { display:flex; align-items:center; gap:4px; }
.leg-box {
  width:20px; height:20px; border-radius:3px;
  font-size:8px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}

/* UPLOAD */
.upload-zone {
  border:2px dashed var(--accent);
  border-radius:10px; padding:16px;
  text-align:center; cursor:pointer;
  transition:all 0.25s; margin-bottom:14px;
  background:rgba(59,130,246,0.04);
  user-select:none;
  position:relative;   /* REQUIRED: contains the absolute input */
  overflow:hidden;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color:var(--acl); background:rgba(59,130,246,0.1);
}
.upload-zone .up-icon { font-size:26px; line-height:1; margin-bottom:6px; }
.upload-zone p { font-size:13px; font-weight:700; color:var(--acl); margin-bottom:2px; }
.upload-zone span { font-size:10px; color:var(--ts); }

/* image preview */
.img-wrap { position:relative; margin-bottom:14px; }
.img-wrap img {
  width:100%; max-height:300px; object-fit:contain;
  border-radius:8px; border:1px solid var(--bdr);
  display:block;
}
.img-remove {
  position:absolute; top:8px; right:8px;
  background:rgba(239,68,68,0.85); color:#fff;
  border:none; border-radius:5px;
  padding:5px 10px; font-size:11px; font-weight:700;
  cursor:pointer; font-family:'Outfit',sans-serif;
  transition:background 0.15s;
}
.img-remove:hover { background:#ef4444; }

/* TABLE */
.tbl-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--bdr); margin-bottom:14px; }
table { width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12px; }
thead { background:var(--panel); position:sticky; top:0; z-index:5; }
th {
  padding:10px 8px; text-align:center; font-size:10px; font-weight:800;
  color:var(--acl); text-transform:uppercase; letter-spacing:0.7px;
  border-bottom:2px solid var(--accent);
}
th.gma-th { color:var(--green); border-bottom-color:var(--green); background:rgba(74,222,128,0.06); }
td { padding:9px 7px; text-align:center; border-bottom:1px solid var(--bdr); font-weight:500; }
tbody tr:hover td { background:rgba(59,130,246,0.04); }
td.lbl { font-weight:700; color:var(--acl); font-size:11px; }
td[contenteditable=true] {
  cursor:text; border-radius:3px; min-width:42px;
  transition:background 0.15s, box-shadow 0.15s;
}
td[contenteditable=true]:hover { background:rgba(59,130,246,0.1) !important; }
td[contenteditable=true]:focus {
  outline:none;
  box-shadow:inset 0 0 0 2px var(--acl) !important;
  background:rgba(59,130,246,0.2) !important;
}
td.gma-col {
  background:rgba(74,222,128,0.06);
  border-left:2px solid rgba(74,222,128,0.25);
}
/* shift colours */
.sk  { background:rgba(251,146,60,0.22)  !important; color:#fb923c !important; font-weight:700; }
.sd  { background:rgba(34,197,94,0.22)   !important; color:#4ade80 !important; font-weight:700; }
.sds { background:rgba(168,85,247,0.22)  !important; color:#d8b4fe !important; font-weight:700; }
.sa  { background:rgba(20,184,166,0.22)  !important; color:#5eead4 !important; font-weight:700; }
.sx  { background:rgba(100,116,139,0.15) !important; color:#94a3b8 !important; }
.sr  { background:rgba(59,130,246,0.18)  !important; color:#93c5fd !important; font-weight:700; }
.sv  { background:rgba(100,116,139,0.22) !important; color:#94a3b8 !important; font-style:italic; }
/* tfoot */
tfoot td {
  font-weight:900; font-size:12px;
  background:rgba(59,130,246,0.16) !important;
  color:var(--acl) !important;
  border-top:2px solid var(--accent);
}
tfoot td.gma-col {
  background:rgba(74,222,128,0.16) !important;
  color:var(--green) !important;
  border-top-color:var(--green);
}

/* ACTIONS */
.actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
.btn {
  padding:9px 18px; font-size:11px; font-weight:700;
  font-family:'Outfit',sans-serif; border:none; border-radius:6px;
  cursor:pointer; transition:all 0.2s;
  text-transform:uppercase; letter-spacing:0.5px;
}
.btn-blue  { background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(59,130,246,0.35); }
.btn-blue:hover  { transform:translateY(-1px); box-shadow:0 6px 16px rgba(59,130,246,0.45); }
.btn-ghost { background:var(--panel); color:var(--ts); border:1px solid var(--bdr); }
.btn-ghost:hover { border-color:var(--accent); color:var(--acl); }

/* TOAST */
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
  background:#1a3050; border:1px solid var(--accent); border-radius:8px;
  padding:10px 22px; font-size:13px; font-weight:600;
  color:var(--acl); opacity:0; transition:opacity 0.3s, transform 0.3s;
  pointer-events:none; z-index:9999; white-space:nowrap;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* OPMERKING col */
.op-col { max-width:120px; font-size:10px; color:var(--ts); text-align:left; padding-left:8px; }

@media(max-width:700px){
  .header h1 { font-size:28px; }
  .stats-row { grid-template-columns:repeat(3,1fr); }
  .card { padding:12px; }
  th,td { padding:7px 4px; font-size:10px; }
  .tab-btn { font-size:9px; padding:6px 10px; }
}
</style>
</head>

    {date:15,day:'VR',qpi:'A', jpa:'R', ays:'D*', fca:'X', gma2:'KW'},
    {date:16,day:'ZA',qpi:'X', jpa:'R', ays:'A',  fca:'D', gma2:'X'},

    {date:1, day:'MA',qpi:'X',  jpa:'R',  ays:'A',  fca:'X',   gma2:'D',  opmerking:''},

    {date:5, day:'VR',qpi:'D*', jpa:'A',  ays:'R',  fca:'X',   gma2:'KW', opmerking:''},

    {date:7, day:'ZO',qpi:'A',  jpa:'X',  ays:'D',  fca:'R',   gma2:'X',  opmerking:'X'},
    {date:8, day:'MA',qpi:'A',  jpa:'R',  ays:'D*', fca:'X',   gma2:'KW', opmerking:''},
    {date:9, day:'DI',qpi:'X',  jpa:'R',  ays:'A',  fca:'X',   gma2:'D',  opmerking:''},

    {date:11,day:'DO',qpi:'R',  jpa:'X',  ays:'X',  fca:'A',   gma2:'D',  opmerking:''},

    {date:25,day:'DO',qpi:'X',  jpa:'R',  ays:'A',  fca:'D*',  gma2:'KW', opmerking:''},

    {date:27,day:'ZA',qpi:'R',  jpa:'X',  ays:'X',  fca:'A',   gma2:'D',  opmerking:''},

    {date:29,day:'MA',qpi:'VAK',jpa:'A',  ays:'R',  fca:'X',   gma2:'D',  opmerking:''},
    {date:30,day:'DI',qpi:'VAK',jpa:'A',  ays:'X',  fca:'R=D*',gma2:'KW', opmerking:''}
  ]
};

// ═══════════════════════════════════════════════
//  STORE
// ═══════════════════════════════════════════════
const store = {};
MONTHS.forEach((m,i)=>{
  const key = 'r26_'+m;
  // Always reload May and June from preset (in case data was updated)
  if(m==='June' || m==='May'){
    store[m] = PRESET[m].map(r=>({...r}));
    localStorage.setItem(key, JSON.stringify(store[m]));
    return;
  }
  let d = null;
  try { const s=localStorage.getItem(key); if(s) d=JSON.parse(s); } catch(e){}
  store[m] = d || (PRESET[m] ? PRESET[m].map(r=>({...r})) : emptyMonth(i));
});

function save(m){ try{ localStorage.setItem('r26_'+m, JSON.stringify(store[m])); }catch(e){ toast('⚠️ Opslaan mislukt'); } }

function emptyMonth(idx){
  return Array.from({length:MDAYS[idx]},(_,i)=>({
    date:i+1, day:DNAMES[i%7], qpi:'', jpa:'', ays:'', fca:'', gma2:'', opmerking:''
  }));
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function hrs(v){
  if(!v) return 0;
  const s=v.toUpperCase();
  if(s.includes('D*')) return 8;
  if(s==='D')  return 12;
  if(s==='A')  return 12;
  if(s.includes('KW')) return 4;
  return 0;
}

function shiftClass(v){
  if(!v) return '';
  const s=v.toUpperCase();
  if(s.includes('D*'))         return 'sds';
  if(s==='D')                  return 'sd';
  if(s==='A')                  return 'sa';
  if(s.includes('KW'))         return 'sk';
  if(s==='X')                  return 'sx';
  if(s==='R'||s.startsWith('R=')) return 'sr';
  if(s==='VAK')                return 'sv';
  return '';
}

function applyColor(td,val){
  td.classList.remove('sk','sd','sds','sa','sx','sr','sv');
  const c=shiftClass(val);
  if(c) td.classList.add(c);
}

function calcTotals(m){
  const t={qpi:0,jpa:0,ays:0,fca:0,gma2:0};
  store[m].forEach(r=>COLS.forEach(c=>{ t[c]+=hrs(r[c]); }));
  return t;
}

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════
let current='May';

function buildTabs(){
  const el=document.getElementById('tabs');
  MONTHS.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(m===current?' active':'');
    b.textContent=m;
    b.onclick=()=>{ current=m; renderAll(); };
    el.appendChild(b);
  });
}

function setActiveTab(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent===current);
  });
}

// ═══════════════════════════════════════════════
//  UPLOAD  (fixed + image compression)
// ═══════════════════════════════════════════════
function processImageFile(file, monthKey){
  if(!file || !file.type.startsWith('image/')){
    toast('⚠️ Selecteer een afbeeldingsbestand.'); return;
  }
  toast('⏳ Foto verwerken...');
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      // Compress: max 1200px wide, quality 0.75
      const MAX=1200;
      let w=img.width, h=img.height;
      if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.75);
      try{
        localStorage.setItem('img_'+monthKey, compressed);
        toast('✅ Foto opgeslagen!');
        renderAll();
      } catch(err){
        toast('⚠️ Opslag vol. Wis een andere foto eerst.');
      }
    };
    img.onerror=()=>toast('⚠️ Afbeelding kon niet geladen worden.');
    img.src=ev.target.result;
  };
  reader.onerror=()=>toast('⚠️ Lezen mislukt. Probeer opnieuw.');
  reader.readAsDataURL(file);
}

function buildUploadZone(monthKey){
  const savedImg=localStorage.getItem('img_'+monthKey);

  if(savedImg){
    // Show image with remove button
    const wrap=document.createElement('div');
    wrap.className='img-wrap';
    const img=document.createElement('img');
    img.src=savedImg;
    img.alt='Rooster foto';
    const rm=document.createElement('button');
    rm.className='img-remove';
    rm.textContent='✕ Verwijder foto';
    rm.onclick=()=>{
      localStorage.removeItem('img_'+monthKey);
      toast('🗑️ Foto verwijderd');
      renderAll();
    };
    wrap.appendChild(img);
    wrap.appendChild(rm);
    return wrap;
  }

  // Build upload zone — NO onclick on the div to avoid double-trigger
  const zone=document.createElement('div');
  zone.className='upload-zone';
  zone.innerHTML=`<div class="up-icon">📸</div>
                  <p>Upload Rooster Foto</p>
                  <span>Klik hier of sleep een afbeelding</span>`;

  // Hidden file input — positioned inside zone via CSS (inset:0, opacity:0)
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*';
  inp.style.cssText='position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;';
  inp.addEventListener('change', e=>{
    const file=e.target.files[0];
    if(file) processImageFile(file, monthKey);
    inp.value=''; // reset so same file can be re-selected
  });

  // Drag & drop — proper independent handler (no proxy)
  zone.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e=>{ e.stopPropagation(); zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation();
    zone.classList.remove('drag-over');
    const file=e.dataTransfer.files[0];
    if(file) processImageFile(file, monthKey);
  });

  zone.appendChild(inp);
  return zone;
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function renderAll(){
  setActiveTab();
  const m    = current;
  const data = store[m];
  const t    = calcTotals(m);
  const card = document.getElementById('card');
  card.innerHTML='';

  // Month heading
  const mh=document.createElement('div');
  mh.className='month-heading';
  mh.textContent=`${m.toUpperCase()} 2026`;
  card.appendChild(mh);

  // Stats
  const sr=document.createElement('div');
  sr.className='stats-row';
  COLS.forEach(c=>{
    const d=document.createElement('div');
    d.className='stat'+(c==='gma2'?' gma-stat':'');
    d.innerHTML=`<div class="stat-name">${c.toUpperCase()}</div>
                 <div class="stat-hrs" id="sh_${c}">${t[c]}</div>
                 <div class="stat-lbl">uren</div>`;
    sr.appendChild(d);
  });
  card.appendChild(sr);

  // Legend
  const leg=document.createElement('div');
  leg.className='legend';
  leg.innerHTML=`
    <div class="leg"><div class="leg-box sd">D</div><span>D = 12u</span></div>
    <div class="leg"><div class="leg-box sds">D*</div><span>D* = 8u</span></div>
    <div class="leg"><div class="leg-box sa">A</div><span>A = 12u</span></div>
    <div class="leg"><div class="leg-box sk">KW</div><span>KW = 4u</span></div>
    <div class="leg"><div class="leg-box sx">X</div><span>X = Vrij</span></div>
    <div class="leg"><div class="leg-box sr">R</div><span>R = Rust</span></div>
    <div class="leg"><div class="leg-box sv">VAK</div><span>VAK = Vakantie</span></div>`;
  card.appendChild(leg);

  // Upload zone
  card.appendChild(buildUploadZone(m));

  // Table
  const wrap=document.createElement('div');
  wrap.className='tbl-wrap';
  const tbl=document.createElement('table');

  // thead
  const thead=document.createElement('thead');
  const htr=document.createElement('tr');
  ['DAT','DAG','QPI','JPA','AYS','FCA','GMA2','OPMERKING'].forEach(h=>{
    const th=document.createElement('th');
    th.textContent=h;
    if(h==='GMA2') th.className='gma-th';
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  tbl.appendChild(thead);

  // tbody
  const tbody=document.createElement('tbody');
  data.forEach(row=>{
    const tr=document.createElement('tr');

    const td1=document.createElement('td'); td1.className='lbl'; td1.textContent=row.date; tr.appendChild(td1);
    const td2=document.createElement('td'); td2.className='lbl'; td2.textContent=row.day;  tr.appendChild(td2);

    COLS.forEach(c=>{
      const td=document.createElement('td');
      td.contentEditable=true;
      td.textContent=row[c]||'';
      if(c==='gma2') td.classList.add('gma-col');
      applyColor(td, row[c]);
      td.addEventListener('focus',()=>{ td.dataset.prev=td.textContent; });
      td.addEventListener('blur',()=>{
        const val=td.textContent.trim().toUpperCase();
        td.textContent=val;
        row[c]=val;
        applyColor(td,val);
        refreshStats(m);
        save(m);
      });
      td.addEventListener('keydown',e=>{
        if(e.key==='Enter'){ e.preventDefault(); td.blur(); }
        if(e.key==='Escape'){ td.textContent=td.dataset.prev||''; td.blur(); }
      });
      tr.appendChild(td);
    });

    // Opmerking
    const tdOp=document.createElement('td');
    tdOp.contentEditable=true;
    tdOp.className='op-col';
    tdOp.textContent=row.opmerking||'';
    tdOp.addEventListener('blur',()=>{ row.opmerking=tdOp.textContent.trim(); save(m); });
    tdOp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); tdOp.blur(); } });
    tr.appendChild(tdOp);

    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);

  // tfoot
  const tfoot=document.createElement('tfoot');
  const ftr=document.createElement('tr');
  const ftd1=document.createElement('td'); ftd1.textContent='TOTAAL'; ftr.appendChild(ftd1);
  const ftd2=document.createElement('td'); ftr.appendChild(ftd2);
  COLS.forEach(c=>{
    const td=document.createElement('td');
    td.id='ft_'+c; td.textContent=t[c];
    if(c==='gma2') td.classList.add('gma-col');
    ftr.appendChild(td);
  });
  const ftdOp=document.createElement('td'); ftr.appendChild(ftdOp);
  tfoot.appendChild(ftr);
  tbl.appendChild(tfoot);

  wrap.appendChild(tbl);
  card.appendChild(wrap);

  // Actions
  const act=document.createElement('div');
  act.className='actions';
  act.innerHTML=`
    <button class="btn btn-blue"  onclick="exportXlsx()">📥 Export Excel</button>
    <button class="btn btn-ghost" onclick="clearMonth()">🗑️ Wis maand</button>`;
  card.appendChild(act);
}

function refreshStats(m){
  const t=calcTotals(m);
  COLS.forEach(c=>{
    const sh=document.getElementById('sh_'+c);
    const ft=document.getElementById('ft_'+c);
    if(sh) sh.textContent=t[c];
    if(ft) ft.textContent=t[c];
  });
}

// ═══════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════
function exportXlsx(){
  const m=current;
  const rows=store[m].map(r=>[r.date,r.day,r.qpi,r.jpa,r.ays,r.fca,r.gma2,r.opmerking||'']);
  const t=calcTotals(m);
  rows.push(['TOTAAL','',t.qpi,t.jpa,t.ays,t.fca,t.gma2,'']);
  const ws=XLSX.utils.aoa_to_sheet([['DAT','DAG','QPI','JPA','AYS','FCA','GMA2','OPMERKING'],...rows]);
  ws['!cols']=[{wch:5},{wch:5},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,m);
  XLSX.writeFile(wb,`Rooster_${m}_2026.xlsx`);
  toast('✅ Excel geëxporteerd!');
}

function clearMonth(){
  if(!confirm(`Alle data voor ${current} wissen?`)) return;
  store[current]=emptyMonth(MONTHS.indexOf(current));
  save(current);
  toast('🗑️ Maand gewist');
  renderAll();
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
buildTabs();
renderAll();
</script>
